<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
<div class="container card p-4 shadow-sm w-75">
    <h4 class="mb-4">Edit Employee Details</h4>
    <form th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post">
        <div class="row g-3">
            <div class="col-md-6">
                <label>Full Name</label>
                <input type="text" class="form-control" th:field="*{fullName}">
                <span class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
            </div>
            <div class="col-md-6">
                <label>Email</label>
                <input type="email" class="form-control" th:field="*{email}">
                <span class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>
            <div class="col-md-4">
                <label>Phone</label>
                <input type="text" class="form-control" th:field="*{phone}">
                <span class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
            </div>
            <div class="col-md-4">
                <label>Department</label>
                <input type="text" class="form-control" th:field="*{department}">
                <span class="text-danger" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></span>
            </div>
            <div class="col-md-4">
                <label>Salary</label>
                <input type="number" step="0.01" class="form-control" th:field="*{salary}">
                <span class="text-danger" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></span>
            </div>
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-warning">Update Employee</button>
            <a th:href="@{/employees}" class="btn btn-secondary ms-2">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
