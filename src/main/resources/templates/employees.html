<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container">
    <h2 class="mb-4 text-center">Employee Management System</h2>

    <!-- Add Employee Form -->
    <div class="card mb-4 p-4 shadow-sm">
        <h4>Add New Employee</h4>
        <form th:action="@{/employees}" th:object="${employee}" method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label>Full Name</label>
                    <input type="text" class="form-control" th:field="*{fullName}">
                    <span class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                </div>
                <div class="col-md-6">
                    <label>Email</label>
                    <input type="email" class="form-control" th:field="*{email}">
                    <span class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>
                <div class="col-md-4">
                    <label>Phone</label>
                    <input type="text" class="form-control" th:field="*{phone}">
                    <span class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                </div>
                <div class="col-md-4">
                    <label>Department</label>
                    <input type="text" class="form-control" th:field="*{department}">
                    <span class="text-danger" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></span>
                </div>
                <div class="col-md-4">
                    <label>Salary</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{salary}">
                    <span class="text-danger" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></span>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Save Employee</button>
        </form>
    </div>

    <!-- Search & Table -->
    <div class="card p-4 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Employee List</h4>
            <form th:action="@{/employees}" method="get" class="d-flex">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control me-2" placeholder="Search by name...">
                <button class="btn btn-outline-primary" type="submit">Search</button>
            </form>
        </div>

        <table class="table table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Department</th><th>Salary</th><th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="emp : ${employees}">
                    <td th:text="${emp.id}"></td>
                    <td th:text="${emp.fullName}"></td>
                    <td th:text="${emp.email}"></td>
                    <td th:text="${emp.phone}"></td>
                    <td th:text="${emp.department}"></td>
                    <td th:text="${emp.salary}"></td>
                    <td>
                        <a th:href="@{/employees/{id}/edit(id=${emp.id})}" class="btn btn-sm btn-warning">Edit</a>
                        <form th:action="@{/employees/{id}/delete(id=${emp.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this employee?');">
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
