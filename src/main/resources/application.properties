spring.application.name=employee-manager

# Import external secret configuration if it exists
spring.config.import=optional:file:secrets.properties

# Database Connection (Adjusted for Mac/Homebrew)
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Thymeleaf setting for live reloads during development
spring.thymeleaf.cache=false
